# ============================================================================
# BBA (1FME) SchNet training — run "schnet_badn_v1"
#
# PROVENANCE OF THIS FILE
#   Hyperparameters (model / optimizer / seed)  <- by:
#       /group/ag_clementi_cmb/users/sayeg84/a12-toolkit/bba_tk_config/training_template.yaml
#   Trainer boilerplate (PyTorch-Lightning 2.x) <- official mlcg example:
#       mlcg/examples/h5_pl/single_molecule/training.yaml
#
#   Note: we modified the template yaml file because that was written for Lightning 1.x
#   (May 2025). We have Lightning 2.6.5 installed, which REMOVED five of the
#   keys he used. Each substitution is marked "PL2:" (pytorch lightening 2.6.5) below.
#
# RUN WITH:
#   mlcg-train_h5 fit --config training.yaml
# note: We can use tmux session
# ============================================================================

seed_everything: 19384

# PL2: 
ckpt_path: last

# ---------------------------------------------------------------------------
# DATA  — points at the files mlcg-tk produced for BBA in step 4 (package_training_data).
# ---------------------------------------------------------------------------
data:
  # The HDF5 written by `mlcg-tk-package_training_data` 
  h5_file_path: /srv/data/itzeljem79/mlcg-tk/bba/out/1FME_badn_poly_min_pair_4.h5

  # The train/val split, ALSO written by step 4. 
  partition_options: /srv/data/itzeljem79/mlcg-tk/bba/out/partition_1FME_badn_poly_min_pair_4.yaml

  # Maps mlcg's internal names -> the actual keys inside h5
  loading_options:
    hdf_key_mapping:
      embeds: attrs:cg_embeds
      coords: cg_coords
      forces: cg_delta_forces

# ---------------------------------------------------------------------------
# MODEL — by /group/ag_clementi_cmb/users/sayeg84/a12-toolkit/bba_tk_config/training_template.yaml
# ---------------------------------------------------------------------------
model:
  loss:
    class_path: mlcg.nn.Loss
    init_args:
      losses:
        - class_path: mlcg.nn.ForceMSE
          init_args:
            force_kwd: forces
  model:
    class_path: mlcg.nn.GradientsOut
    init_args:
      targets: forces
      model:
        class_path: mlcg.nn.schnet.StandardSchNet
        init_args:
          hidden_channels: 128
          num_filters: 128
          num_interactions: 2
          output_hidden_layer_widths:
            - 100
            - 60
            - 30
          activation:
            class_path: torch.nn.Tanh
            init_args: {}
          max_num_neighbors: 100
          aggr: add
          cutoff:
            class_path: mlcg.nn.CosineCutoff
            init_args:
              cutoff_lower: 0
              cutoff_upper: 20
          rbf_layer:
            class_path: mlcg.nn.ExpNormalBasis
            init_args:
              cutoff: 20
              num_rbf: 32
              trainable: false
          # embedding_size NOT set -> mlcg default is 100.
          # My BBA embeddings run 1..20, so 100 is comfortably enough.


# note: The repo example uses AdamW + weight_decay 0.01 instead
optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 0.0001
    weight_decay: 0

# ---------------------------------------------------------------------------
# TRAINER — structure from the repo example (Lightning 2.x-clean),
#           values by /group/ag_clementi_cmb/users/sayeg84/a12-toolkit/bba_tk_config/training_template.yaml
# ---------------------------------------------------------------------------
trainer:
  # note: Everything below writes here. NOT in the git repo: checkpoints and
  # tensorboard logs are large binaries. Lives next to the h5 on the fast
  # local disk. Creates ./ckpt and ./tensorboard underneath.
  default_root_dir: /srv/data/itzeljem79/mlcg-tk/bba/train/schnet_badn_v1

  max_epochs: 1000        # <- supervisor. ~11 400 steps/epoch here; see README.
  max_time: null
  profiler: null

  accelerator: gpu        # <- both
  strategy: ddp           # <- both
  devices: 1              # PL2: `gpus: 1` was renamed to `devices`.
  num_nodes: 1            # <- supervisor
  precision: 32           # <- supervisor
  benchmark: false        # <- supervisor

  # PL2: 
  use_distributed_sampler: false

  logger:
    - class_path: pytorch_lightning.loggers.TensorBoardLogger
      init_args:
        # The literal string "default_root_dir" is a SENTINEL that mlcg's own
        # LightningCLI swaps for the real path above (see mlcg/pl/cli.py).
        # It is not a mistake and not a variable - leave it as-is.
        save_dir: default_root_dir
        name: tensorboard
        version: ''

  enable_checkpointing: true
  callbacks:
    - class_path: pytorch_lightning.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch
        log_momentum: false
    # The supervisor used plain `ModelCheckpoint`; the repo example uses
    # mlcg's own `OffsetCheckpoint`, which is a drop-in superset (adds
    # start_epoch). Keeping HIS settings, on the mlcg-native class.
    - class_path: mlcg.pl.OffsetCheckpoint
      init_args:
        start_epoch: 0
        dirpath: default_root_dir     # sentinel -> <default_root_dir>/ckpt
        monitor: validation_loss
        every_n_epochs: 1
        filename: '{epoch}-{validation_loss:.4f}'
        save_last: true
        save_top_k: -1                # <- reference yaml

  log_every_n_steps: 500              # <- reference yaml
  gradient_clip_val: 0                # <- reference yaml. Repo example uses 10.0 for stability.
  gradient_clip_algorithm: norm       # <- reference yaml
  check_val_every_n_epoch: 1          # <- reference yaml
  accumulate_grad_batches: 1          # <- reference yaml
  fast_dev_run: false                 # <- reference yaml
  deterministic: false                # <- reference yaml
  detect_anomaly: false               # <- reference yaml
  enable_model_summary: false         # <- reference yaml
  enable_progress_bar: true           # <- repo example. Set to false when
                                      #    redirecting stdout to a log file.

# ---------------------------------------------------------------------------
# REMOVED FROM THE REFERENCE TEMPLATE (would crash on Lightning 2.6.5):
#   auto_lr_find: false       -> deleted in PL 2.0 (was a no-op here anyway)
#   track_grad_norm: -1       -> deleted in PL 2.0 (was disabled anyway)
#   replace_sampler_ddp       -> renamed  use_distributed_sampler  (kept above)
#   resume_from_checkpoint    -> replaced by top-level ckpt_path   (kept above)
#   gpus                      -> renamed  devices                  (kept above)
# ---------------------------------------------------------------------------
